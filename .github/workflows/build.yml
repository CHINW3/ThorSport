name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Builds only when asked: a commit whose message contains [release], or "Run workflow" on GitHub.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the APK (also downloads all team logos)
        run: gradle assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ThorSport-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a download
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ThorSport.apk
          V=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          echo "VERSION=$V" >> $GITHUB_ENV
          # release notes = this version's section of CHANGELOG.md + install tip
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          printf '\n**Install:** copy ThorSport.apk to your AYN Thor and open it. If it opens on the top screen: long-press the icon → Screen Launch → Bottom Screen. From 3.6 on, update from Settings → App update.\n' >> notes.md

      - name: Latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ThorSport ${{ env.VERSION }}
          body_path: notes.md
          files: ThorSport.apk
          make_latest: true
