name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the APK (also downloads all team logos)
        run: gradle assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ThorStandings-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a download
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk ThorSport.apk

      - name: Latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ThorSport (latest build)
          body: Install ThorSport.apk on your AYN Thor. Rebuilt automatically on every update.
          files: ThorSport.apk
          make_latest: true
